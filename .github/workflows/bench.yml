# The benchmarks against Stim and PyMatching on both kinds of Linux runner, x86_64 and arm64,
# each with a wheel built natively on it, so every ratio comes from the machine it describes.
# CI calls it on every push with `check` (a ratio twice the last run recorded for the same kind
# of machine fails); run it by hand, or let a release run it, for runs to record with
# `tools/bench.py --add` (each run's JSON is printed in its log and uploaded).
name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      runners:
        description: The runners, as a JSON list
        default: '["ubuntu-latest", "ubuntu-24.04-arm"]'
      rustflags:
        description: RUSTFLAGS for the wheel (to measure, say, a target CPU)
        default: ""
      profile:
        description: A job of examples/hot.rs to profile with perf on each runner instead (dem, match, corr, ...)
        default: ""
  release:
    types: [published]
  workflow_call:
    inputs:
      check:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    if: ${{ !inputs.profile }}
    name: Benchmarks (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the wheel, with Stim and PyMatching
        env:
          RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --out dist
          python -m pip install dist/*.whl numpy stim pymatching
      # Ratios to Stim's and PyMatching's times on this runner; the table goes to the summary.
      - name: Benchmarks
        run: |
          python tools/bench.py ${{ inputs.check && '--check' || '' }} --summary "$GITHUB_STEP_SUMMARY" --json bench.json
          cat bench.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmarks-${{ matrix.runner }}
          path: bench.json

  profile:
    if: ${{ inputs.profile }}
    name: Profile ${{ inputs.profile }} (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: perf
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -q linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1
      - name: Profile the native job
        env:
          RUSTFLAGS: ${{ inputs.rustflags }} -C force-frame-pointers=yes
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          cargo build --release --no-default-features --example hot
          ./target/release/examples/hot ${{ inputs.profile }} 5
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          $PERF record -o perf.data ./target/release/examples/hot ${{ inputs.profile }} 40 2>/dev/null
          $PERF report -i perf.data --stdio --no-children --percent-limit 0.5 | head -60
          # The two hottest functions, instruction by instruction (the hottest lines first).
          $PERF report -i perf.data --stdio --no-children -F sym --percent-limit 10 2>/dev/null | grep -oE "\] .*" | cut -c3- | head -2 > top.txt
          while read -r sym; do
            echo "=== $sym"
            $PERF annotate -i perf.data --stdio --symbol="$sym" 2>/dev/null | grep -E "^ +[0-9]+\.[0-9]+ +:" | sort -rn | head -45
          done < top.txt
