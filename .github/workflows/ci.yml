# Every push and pull request: the Rust tests (with a randomized no-panic run), the
# WebAssembly engine built fresh and exercised in Node (as the page exercises it), the site's
# own tests; the Python package built once per platform, checked against Stim, PyMatching,
# ldpc and beliefmatching, and its test suite run on every supported Python on Linux, macOS
# and Windows; and a fuzzing run of the parsers and decoders.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Rust tests, WebAssembly and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (the engine, the crate's API as a dependent uses it, and its doc examples)
        run: cargo test --release --no-default-features
      - name: The crate's documentation builds without warnings
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build the WebAssembly engine
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Site tests
        run: |
          node tools/site-tests.mjs
          node tools/contrast.mjs
      - name: README tables match their data
        run: python3 tools/readme_tables.py --check
      - name: The fresh engine in Node (Willow's detection events, decoding, streams)
        run: node tools/wasm-smoke.mjs target/wasm32-unknown-unknown/release/stabilizer_qec.wasm
      - name: The committed engine, the one the site serves
        run: node tools/wasm-smoke.mjs stabilizer_qec.wasm

  semver:
    name: The crate's API against its last release (cargo-semver-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  msrv:
    name: The oldest Rust the crate supports (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.87
      - run: cargo check --lib --tests

  wheel:
    name: Wheel and checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install it with Stim and PyMatching
        shell: bash
        run: python -m pip install dist/*.whl numpy stim pymatching
      - name: Smoke test, from outside the repository
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke.py"
      - name: The gate table is what Stim's tableaus give
        if: matrix.os == 'ubuntu-latest'
        run: python tools/gen_gates.py --check
      - name: Quick cross-check against Stim and PyMatching
        if: matrix.os == 'ubuntu-latest'
        run: python tools/xcheck.py --quick
      - name: BP and belief-matching against ldpc and beliefmatching, exactly
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install ldpc beliefmatching
          python tools/bp_check.py --quick
      - name: The gross code and BP+OSD against Bravyi et al.'s construction, Stim and ldpc
        if: matrix.os == 'ubuntu-latest'
        run: python tools/bb_check.py --quick
      - name: Lattice surgery against Stim and PyMatching
        if: matrix.os == 'ubuntu-latest'
        run: python tools/surgery.py check --quick
      - name: The gross code's logical measurement against Stim and ldpc
        if: matrix.os == 'ubuntu-latest'
        run: python tools/gross_ops.py check --quick

  tests:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install the wheel and the test tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest hypothesis
      - name: Install the reference packages that build for this Python (tests skip the rest)
        shell: bash
        run: |
          for p in stim pymatching ldpc beliefmatching scipy; do
            python -m pip install --only-binary=:all: "$p" || echo "::notice::$p is not available for Python ${{ matrix.python }} on ${{ matrix.os }}"
          done
      - name: Tests
        run: python -m pytest tests -q

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Circuits, a minute from the seeds
        run: |
          mkdir -p fuzz/corpus/circuit && cp fuzz/seeds/circuit/* fuzz/corpus/circuit/
          cargo +nightly fuzz run circuit fuzz/corpus/circuit -- -max_total_time=60 -rss_limit_mb=4096 -timeout=120
      - name: Detector error models, a minute from the seeds
        run: |
          mkdir -p fuzz/corpus/dem && cp fuzz/seeds/dem/* fuzz/corpus/dem/
          cargo +nightly fuzz run dem fuzz/corpus/dem -- -max_total_time=60 -rss_limit_mb=4096 -timeout=120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
