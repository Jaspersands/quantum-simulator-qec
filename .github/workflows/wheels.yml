# Wheels for PyPI, built on a version tag (v*) or by hand.
#
# Building runs anywhere. Publishing runs only on a tag, by PyPI's trusted
# publishing: stabilizer-qec trusts this repository's workflow "wheels.yml"
# in environment "pypi".
name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One abi3 wheel per platform serves every CPython from 3.9; glibc (manylinux) and musl
  # (Alpine, musllinux) Linux alike.
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        libc: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist
          # The manylinux2014 aarch64 cross image's g++ dies without a word on one HiGHS file
          # (2.0.0's first build); the 2_28 image builds it, as the free-threaded job shows.
          manylinux: ${{ matrix.libc == 'auto' && matrix.target == 'aarch64' && '2_28' || matrix.libc }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist

  windows:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.target == 'aarch64' && 'arm64' || 'x64' }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  # Free-threaded CPython has no stable ABI: a wheel of its own per version (cp314t).
  free-threaded:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - runner: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
          - runner: macos-latest
            target: universal2-apple-darwin
          - runner: windows-latest
            target: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: runner.os != 'Linux'
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist -i python3.14t
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-free-threaded-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Each wheel the publish job uploads is installed on a runner of its own platform and run through
  # tools/smoke.py first, so a wheel that does not work never reaches PyPI. The musllinux wheels run
  # in an Alpine container; the universal2 macOS wheel runs on Apple silicon and on Intel.
  smoke:
    needs: [linux, macos, windows, free-threaded]
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: wheels-linux-x86_64-auto
            runner: ubuntu-latest
            python: "3.12"
          - artifact: wheels-linux-x86_64-musllinux_1_2
            runner: ubuntu-latest
            image: python:3.12-alpine
          - artifact: wheels-linux-aarch64-auto
            runner: ubuntu-24.04-arm
            python: "3.12"
          - artifact: wheels-linux-aarch64-musllinux_1_2
            runner: ubuntu-24.04-arm
            image: python:3.12-alpine
          - artifact: wheels-macos
            runner: macos-latest
            python: "3.12"
          - artifact: wheels-macos
            runner: macos-15-intel
            python: "3.12"
          - artifact: wheels-windows-x64
            runner: windows-latest
            python: "3.12"
          - artifact: wheels-windows-aarch64
            runner: windows-11-arm
            python: "3.12"
          - artifact: wheels-free-threaded-ubuntu-latest-x86_64
            runner: ubuntu-latest
            python: "3.14t"
          - artifact: wheels-free-threaded-ubuntu-latest-aarch64
            runner: ubuntu-24.04-arm
            python: "3.14t"
          - artifact: wheels-free-threaded-macos-latest-universal2-apple-darwin
            runner: macos-latest
            python: "3.14t"
          - artifact: wheels-free-threaded-windows-latest-x64
            runner: windows-latest
            python: "3.14t"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/setup-python@v6
        if: ${{ !matrix.image }}
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel with Stim and PyMatching
        if: ${{ !matrix.image }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl numpy stim==1.16.0 pymatching==2.4.0
      - name: Smoke test, from outside the repository
        if: ${{ !matrix.image }}
        shell: bash
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke.py"
      - name: Install the wheel with Stim and PyMatching in Alpine, and run the smoke test
        if: ${{ matrix.image }}
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" "${{ matrix.image }}" sh -c 'pip install --upgrade pip && pip install /work/dist/*.whl numpy stim==1.16.0 pymatching==2.4.0 && cd /tmp && python /work/tools/smoke.py'

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, free-threaded, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
