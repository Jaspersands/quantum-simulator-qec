[package]
name = "stabilizer_qec"
version = "0.2.0"
edition = "2021"
description = "Surface-code simulation and decoding: Stim-format circuits and error models, exact sparse-blossom and correlated matching, a bit-parallel sampler, and window decoders."
license = "MIT"
repository = "https://github.com/Jaspersands/quantum-simulator-qec"
homepage = "https://qcompiler.jaspersands.com"
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/pyproject.toml", "/python/README.md", "/stabilizer_qec.pyi"]

[lib]
name = "stabilizer_qec"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.8", optional = true }

[dependencies.pyo3]
version = "0.22"
features = ["extension-module", "abi3-py39"]
optional = true

[features]
default = ["python"]
python = ["dep:pyo3", "dep:rand"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The Python module. Release, but unstripped: Rust 1.90's default debuginfo
# strip leaves the cross-built arm64 module's symbol string table unaligned,
# and macOS's loader then refuses it ("mis-aligned LINKEDIT string pool").
[profile.python]
inherits = "release"
strip = false
