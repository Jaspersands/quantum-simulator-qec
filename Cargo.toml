[package]
name = "stabilizer_qec"
version = "2.0.0"
edition = "2021"
description = "Quantum error-correction simulation and decoding: Stim-format circuits and error models, a bit-parallel sampler, sparse-blossom, correlated and belief matching, BP+OSD, window decoders, bivariate bicycle codes and lattice surgery."
license = "MIT AND Apache-2.0"
repository = "https://github.com/Jaspersands/quantum-simulator-qec"
homepage = "https://qcompiler.jaspersands.com"
documentation = "https://docs.rs/stabilizer_qec"
readme = "docs/crate.md"
keywords = ["quantum", "error-correction", "surface-code", "decoder", "stim"]
categories = ["science", "simulation"]
rust-version = "1.87"
include = ["/src", "/build.rs", "/data/surgery/golden.json", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/LICENSES", "/THIRD_PARTY_NOTICES.md", "/README.md", "/docs/crate.md", "/pyproject.toml", "/python/README.md", "/python/stabilizer_qec"]


[lib]
name = "stabilizer_qec"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.8", optional = true }
# The GPU sampler (`gpu` feature): wgpu over Metal, Vulkan and DX12, WGSL shaders only.
wgpu = { version = "30", optional = true, default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }
pollster = { version = "1", optional = true }

[build-dependencies]
# compiles HiGHS for the `highs` feature (build.rs)
cc = { version = "1.2", optional = true, features = ["parallel"] }

[dependencies.pyo3]
version = "0.29"
features = ["extension-module", "abi3-py39", "multiple-pymethods"]
optional = true

[features]
# The Python bindings are opt-in (maturin turns them on, pyproject.toml): a Rust user gets
# the engine alone.
default = []
python = ["dep:pyo3", "dep:rand"]
# MWPF's linear programs by HiGHS (C++, src/highs/), as MWPF's own wheels solve them; without it, by
# this crate's simplex
highs = ["dep:cc"]
# Frame sampling on a GPU through wgpu (`src/gpu`), the lane program's second executor
gpu = ["dep:wgpu", "dep:pollster"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The Python module. Release, but unstripped: Rust 1.90's default debuginfo
# strip leaves the cross-built arm64 module's symbol string table unaligned,
# and macOS's loader then refuses it ("mis-aligned LINKEDIT string pool").
[profile.python]
inherits = "release"
strip = false
