[package]
name = "stabilizer_qec"
version = "0.1.0"
edition = "2021"

[lib]
name = "stabilizer_qec"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = { version = "0.8", optional = true }

[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
optional = true

[features]
default = ["python"]
python = ["dep:pyo3", "dep:rand"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The Python module. Release, but unstripped: Rust 1.90's default debuginfo
# strip leaves the cross-built arm64 module's symbol string table unaligned,
# and macOS's loader then refuses it ("mis-aligned LINKEDIT string pool").
[profile.python]
inherits = "release"
strip = false
