[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "stabilizer-qec"
# The Python package is versioned on its own; the Rust crate has its own version (Cargo.toml).
version = "1.9.0"
description = "A quantum error-correction simulator and decoder in Rust: circuits and error models in Stim's formats, exact sparse-blossom, correlated and belief matching, BP+OSD for IBM's gross code, lattice surgery, and window decoders for real time."
readme = "python/README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
authors = [{ name = "Jasper Sands" }]
keywords = ["quantum error correction", "surface code", "decoder", "matching", "stim", "bp-osd", "qldpc", "lattice surgery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
# stabilizer_qec.sinter needs nothing more, but plots with matplotlib.
plot = ["matplotlib>=3.5"]
# 1.x's name for the extra (it installed sinter and Stim, which 2.0 does without).
sinter = ["matplotlib>=3.5"]
# stabilizer_qec.ldpc returns scipy's sparse matrices, as ldpc does.
ldpc = ["scipy>=1.7"]
# stabilizer_qec.qldpc (qLDPC 0.4.1) needs what qLDPC needs beyond its QEC stack, and Python 3.11.
qldpc = ["scipy>=1.14.1", "galois>=0.4.2", "sympy>=1.12", "cvxpy>=1.3.2", "networkx>=2.6.2", "diskcache>=5", "platformdirs>=4", "pyperclip>=1.11", "tqdm>=4"]
# stabilizer_qec.qecsim (qecsim 1.0b9) and stabilizer_qec.bposd (bposd 2.1) need what those do.
qecsim = ["scipy>=1.3", "networkx>=2.1", "mpmath>=1", "click>=7"]
bposd = ["scipy>=1.7"]
# stabilizer_qec.mqt_qecc (MQT QECC 2.0.0) needs what MQT QECC does, but for the tools of
# this package's own (Stim, sinter, ldpc, PyMatching, qecsim, bposd): Python 3.10.
mqt = [
  "qiskit[qasm3-import]>=1.0.0; python_version >= '3.10'",
  "matplotlib>=3.7.1; python_version >= '3.10'",
  "numba>=0.57; python_version >= '3.10'",
  "scipy>=1.15.2; python_version >= '3.10'",
  "z3-solver>=4.15.3; python_version >= '3.10'",
  "multiprocess>=0.70.17; python_version >= '3.10'",
  "tqdm>=4.66.2; python_version >= '3.10'",
  "networkx>=3.4.2; python_version >= '3.10'",
  "mpmath>=1; python_version >= '3.10'",
  "click>=7; python_version >= '3.10'",
]
# stabilizer_qec.quits (QUITS 1.2.0) needs what QUITS does beyond Stim and ldpc: Python 3.10.
quits = [
  "scipy>=1.9.3; python_version >= '3.10'",
  "networkx>=2.8.8; python_version >= '3.10'",
  "tqdm>=4; python_version >= '3.10'",
  "matplotlib>=3.5; python_version >= '3.10'",
]
# stabilizer_qec.panqec (PanQEC 0.1.7) needs what PanQEC does beyond ldpc and PyMatching; its
# GUI needs Flask too (`panqec-gui`).
panqec = ["scipy>=1.8.0", "pandas>=1.4.2", "matplotlib>=3.3.4", "tqdm>=4.59.0", "python-dotenv>=0.17.0", "psutil>=5.8.0", "click>=8.1.2"]
panqec-gui = ["scipy>=1.8.0", "pandas>=1.4.2", "matplotlib>=3.3.4", "tqdm>=4.59.0", "python-dotenv>=0.17.0", "psutil>=5.8.0", "click>=8.1.2", "Flask>=2.0.1"]

[project.scripts]
stabilizer-qec = "stabilizer_qec._cli:main"

[project.urls]
Homepage = "https://qcompiler.jaspersands.com"
Repository = "https://github.com/Jaspersands/quantum-simulator-qec"

[tool.maturin]
features = ["python", "highs"]
profile = "python"
module-name = "stabilizer_qec._core"
python-source = "python"
